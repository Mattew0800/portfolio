<div class="app-shell">
  @if (!showLanguageModal()) {
    <div class="runtime-language-switcher" role="group" aria-label="language switcher">
      <span>{{ 'language.switcherLabel' | translate }}</span>
      <button
        type="button"
        [class.active]="currentLanguage() === 'es'"
        (click)="selectLanguage('es')"
      >
        ES
      </button>
      <button
        type="button"
        [class.active]="currentLanguage() === 'en'"
        (click)="selectLanguage('en')"
      >
        EN
      </button>
    </div>
  }

  <router-outlet></router-outlet>
</div>

@if (showLanguageModal()) {
  <div class="language-modal-backdrop" role="dialog" aria-modal="true" aria-label="language selector">
    <div class="language-modal">
      <h2>Select language / Selecciona idioma</h2>
      <div class="language-modal-actions">
        <button type="button" (click)="selectLanguage('es')">Español</button>
        <button type="button" (click)="selectLanguage('en')">English</button>
      </div>
    </div>
  </div>
}
