<app-cockpit-screen-frame (back)="onBack()">
    <div class="boot-screen">
        <div class="boot-panel">

            <div class="boot-panel__topbar" aria-hidden="true">
                <span class="boot-panel__topbar-label">terminal</span>
                <span class="boot-panel__topbar-dot"></span>
            </div>

            <p class="boot-panel__section-label">Boot Sequence</p>

            <ol class="boot-logs" aria-label="Boot sequence log">
                @for (entry of visibleEntries; track entry.id) {
                    <li class="boot-log">
                        <span class="boot-log__arrow" aria-hidden="true">→</span>
                        <span class="boot-log__text">{{ entry.text }}</span>
                        @if (entry.status === 'ok') {
                            <span class="boot-log__status" aria-label="OK">OK</span>
                        } @else if (entry.status === 'pending') {
                            <span class="boot-log__pending" aria-hidden="true">...</span>
                        }
                    </li>
                }
            </ol>

            @if (showIdentity) {
                <div class="boot-divider" aria-hidden="true"></div>

                <div class="boot-identity" aria-label="Developer identity">
                    <p class="boot-identity__name">{{ NAME }}</p>
                    <p class="boot-identity__role">{{ ROLE }}</p>
                    <p class="boot-identity__stack">{{ STACK }}</p>
                </div>

                @if (showReady) {
                    <div class="boot-ready" role="status" aria-live="polite">
                        <span class="boot-ready__text">System ready</span>
                        <span class="boot-ready__cursor" aria-hidden="true"></span>
                    </div>
                }
            }

        </div>
    </div>
</app-cockpit-screen-frame>
