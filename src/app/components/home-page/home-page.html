<section class="home" [class.home--warping]="isWarping">

    <!-- ─── CANVAS LAYERS ─────────────────────────────────────── -->
    <canvas #bgCanvas   class="home__canvas home__canvas--bg"></canvas>
    <canvas #warpCanvas class="home__canvas home__canvas--warp"></canvas>

    <!-- ─── HUD DECORATIVO ───────────────────────────────────── -->
    <div class="hud" aria-hidden="true">
        <span class="hud__corner hud__corner--tl"></span>
        <span class="hud__corner hud__corner--tr"></span>
        <span class="hud__corner hud__corner--bl"></span>
        <span class="hud__corner hud__corner--br"></span>
        <div class="hud__scanline"></div>
        <div class="hud__grid"></div>
        <!-- Líneas horizontales a 15% y 85% -->
        <div class="hud__line hud__line--top"></div>
        <div class="hud__line hud__line--bottom"></div>
    </div>

    <!-- ─── CONTENIDO CENTRAL ────────────────────────────────── -->
    <main class="home__content">

        <!-- Nombre -->
        <div class="name-block">
            <h1 class="name animate-fadein" style="--delay: 0.4s" [attr.aria-label]="FULL_NAME">
                {{ displayedName }}<span class="name__cursor" [class.name__cursor--hidden]="!showCursor"></span>
            </h1>
            <span class="name name--glitch" aria-hidden="true">{{ displayedName }}</span>
        </div>

        <!-- Título destacado -->
        <p class="title title--main animate-fadein" style="--delay: 2.5s">{{ JOB_TITLE }}</p>
        <p class="stack animate-fadein" style="--delay: 2.8s">{{ TECH_STACK }}</p>

        <!-- Divisor -->
        <div class="divider animate-fadein" style="--delay: 3.1s" aria-hidden="true"></div>

        <!-- CTA -->
        <button
                class="cta animate-fadein"
                style="--delay: 3.4s"
                (click)="onEnterCockpit()"
                [disabled]="isWarping"
                aria-label="Ingresar al cockpit"
        >
            <span class="cta__bracket">[</span>
            &nbsp;INGRESAR AL COCKPIT&nbsp;
            <span class="cta__bracket">]</span>
        </button>

        <!-- Redes sociales -->
        <nav class="social animate-fadein" style="--delay: 3.8s" aria-label="Redes sociales">
            <button class="social__link" (click)="openLink(GITHUB_URL)">
                <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48
                   0-.24-.01-.87-.01-1.7-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47
                   -.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83
                   .09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.99 1.03-2.69
                   -.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85.004
                   1.7.115 2.5.337 1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.4.1 2.65.64.7
                   1.03 1.6 1.03 2.69 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85 0 1.34
                   -.01 2.42-.01 2.75 0 .27.18.58.69.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/>
                </svg>
                GitHub
            </button>

            <span class="social__sep" aria-hidden="true">//</span>

            <button class="social__link" (click)="openLink(LINKEDIN_URL)">
                <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14
                   2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.37-1.85 3.6 0 4.27
                   2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1
                   0 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56
                   C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0
                   22.23 0z"/>
                </svg>
                LinkedIn
            </button>
        </nav>

    </main>

    <!-- ─── HUD INFERIOR — solo reloj ────────────────────────── -->
    <footer class="sys-bar" aria-label="Hora del sistema">
        SYS // {{ systemTime }}
    </footer>

</section>
